name: Deploy

on:
  push:
    branches: [master]

jobs:
  # ── Backend: deploy to office VPS via SSH ────────────────────────────────────
  deploy-backend:
    name: Backend → VPS (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /srv/musren-nexus

            echo "--- Pulling latest code ---"
            git pull origin master

            echo "--- Building containers ---"
            docker compose up -d --build --remove-orphans

            echo "--- Waiting for backend to be healthy ---"
            for i in $(seq 1 30); do
              docker compose exec -T backend php-fpm -t 2>/dev/null && break
              echo "Waiting... ($i/30)"
              sleep 3
            done

            echo "--- Running migrations ---"
            docker compose exec -T backend php artisan migrate --force

            echo "--- Caching config and routes ---"
            docker compose exec -T backend php artisan config:cache
            docker compose exec -T backend php artisan route:cache

            echo "--- Deployment complete ---"
            docker compose ps

  # ── Frontend: build & deploy to Cloudflare Workers ──────────────────────────
  deploy-frontend:
    name: Frontend → Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: musren-nexus-frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: musren-nexus-frontend

      - name: Build
        run: npm run build
        working-directory: musren-nexus-frontend

      - name: Deploy to Cloudflare Workers
        # vite build (via Nitro) generates .output/server/wrangler.json with the
        # correct main, no_bundle:true, and assets config merged from our wrangler.jsonc.
        # Running wrangler against that generated config avoids re-bundling from source.
        # --var passes runtime env vars that wrangler.jsonc defines but the generated
        # wrangler.json doesn't inherit (since we deploy from the generated file).
        run: npx wrangler deploy --config .output/server/wrangler.json --var BACKEND_URL:http://musren.quantumconnect.africa
        working-directory: musren-nexus-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
