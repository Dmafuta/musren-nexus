version: "3.9"

services:

  # ─── Laravel Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./musren-nexus-backend/api
      dockerfile: Dockerfile
    ports:
      - "8081:8000"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_BASE_URL:-http://localhost:8081}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}

      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-musren_local}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_INITIATOR_NAME: ${MPESA_INITIATOR_NAME:-testapi}
      MPESA_SECURITY_CREDENTIAL: ${MPESA_SECURITY_CREDENTIAL}
      MPESA_ENV: ${MPESA_ENV:-sandbox}

      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_API_KEY: ${AT_API_KEY}
      AT_SENDER_ID: ${AT_SENDER_ID:-MUSREN}

      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-resend}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM:-noreply@musren.co.ke}
      MAIL_FROM_NAME: "Musren Connect"

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8082}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ─── Frontend (dev server) ───────────────────────────────────────────────────
  frontend:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./musren-nexus-frontend:/app
    ports:
      - "5173:5173"
    command: bun run dev --host 0.0.0.0
    environment:
      VITE_SUPABASE_URL: ${SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      VITE_API_URL: http://localhost:8081
    depends_on:
      backend:
        condition: service_healthy
