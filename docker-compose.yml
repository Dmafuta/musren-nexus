version: "3.9"

services:

  # ─── Laravel (PHP-FPM) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./musren-nexus-backend/api
      dockerfile: Dockerfile
    environment:
      APP_NAME: "Musren Connect"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}

      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-musren_local}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE}
      MPESA_PASSKEY: ${MPESA_PASSKEY}
      MPESA_INITIATOR_NAME: ${MPESA_INITIATOR_NAME}
      MPESA_SECURITY_CREDENTIAL: ${MPESA_SECURITY_CREDENTIAL}
      MPESA_ENV: ${MPESA_ENV:-production}
      MPESA_STK_CALLBACK_URL: ${MPESA_STK_CALLBACK_URL}

      AT_USERNAME: ${AT_USERNAME}
      AT_API_KEY: ${AT_API_KEY}
      AT_SENDER_ID: ${AT_SENDER_ID:-MUSREN}

      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-resend}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@musren.co.ke}
      MAIL_FROM_NAME: "Musren Connect"

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://musren.quantumconnect.africa}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@musren.co.ke}

    volumes:
      # Persist storage (logs, cache, uploads)
      - backend_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ─── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./musren-nexus-backend/api/public:/var/www/html/public:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_storage:
