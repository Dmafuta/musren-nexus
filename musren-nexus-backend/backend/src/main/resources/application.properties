spring.application.name=musren-nexus-backend

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Database (Supabase PostgreSQL via PgBouncer connection pooler) ───────────
# Use port 6543 (pooler) instead of 5432 (direct) for production scalability.
# prepareThreshold=0 is required for PgBouncer transaction-mode pooling.
spring.datasource.url=jdbc:postgresql://${DB_HOST:db.hojqiymudpnjyyqeqvrl.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# ─── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ddl-auto=none — Flyway manages schema, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── Supabase ─────────────────────────────────────────────────────────────────
supabase.url=${SUPABASE_URL:https://hojqiymudpnjyyqeqvrl.supabase.co}
# Find in: Supabase Dashboard → Project Settings → API → JWT Secret
supabase.jwt-secret=${SUPABASE_JWT_SECRET:change-me}
# Find in: Supabase Dashboard → Project Settings → API → service_role key (keep server-side only!)
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:change-me}

# ─── M-Pesa Daraja (B2C payouts) ─────────────────────────────────────────────
# Find credentials in: developer.safaricom.co.ke → My Apps
mpesa.consumer-key=${MPESA_CONSUMER_KEY:change-me}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:change-me}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.initiator-name=${MPESA_INITIATOR_NAME:testapi}
# SecurityCredential = InitiatorPassword encrypted with M-Pesa public cert (RSA)
mpesa.security-credential=${MPESA_SECURITY_CREDENTIAL:change-me}
mpesa.b2c-result-url=${APP_BASE_URL:http://localhost:8080}/api/webhooks/mpesa/b2c/result
mpesa.b2c-timeout-url=${APP_BASE_URL:http://localhost:8080}/api/webhooks/mpesa/b2c/timeout
# Set to "production" for live transactions
mpesa.environment=${MPESA_ENV:sandbox}

# ─── Africa's Talking (airtime & data disbursement) ──────────────────────────
# Find credentials in: africastalking.com → Settings → API Key
# Use username=sandbox + any apiKey for sandbox testing
africastalking.username=${AT_USERNAME:sandbox}
africastalking.api-key=${AT_API_KEY:change-me}
africastalking.sender-id=${AT_SENDER_ID:MUSREN}

# ─── Mail ─────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:change-me}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@musren.co.ke}
app.mail.support=${MAIL_SUPPORT:support@musren.co.ke}

# ─── App ──────────────────────────────────────────────────────────────────────
app.admin-email=${ADMIN_EMAIL:adminbrandboost@gmail.com}

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://musren.co.ke}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.ke.co.musren=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
